stages:
  - build
  - test

variables:
  RUST_VERSION: stable
  C_COMPILER: gcc

before_script:
  - apt update && apt install -y build-essential rustc cargo make
  - rustc --version
  - cargo --version
  - $C_COMPILER --version
  - make --version

build:
  stage: build
  image: ubuntu:latest
  script:
    - make

test:
  stage: test
  needs: ["build"]
  script:
    - make CI-test
