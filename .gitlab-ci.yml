stages:
  - build
  - test

variables:
  RUST_VERSION: stable
  C_COMPILER: gcc

before_script:
  - apt update && apt install -y build-essential rustc cargo make
  - rustc --version
  - cargo --version
  - $C_COMPILER --version
  - make --version

build:
  stage: build
  image: ubuntu:latest
  script:
    - make > build.log 2>&1
    - make install-test > install-test.log 2>&1
  artifacts:
    when: always
    paths:
      - build.log
      - install-test.log

test:
  stage: test
  needs: ["build"]
  script:
    - make CI-test > test.log 2>&1
  artifacts:
    when: always
    paths:
      - test.log
