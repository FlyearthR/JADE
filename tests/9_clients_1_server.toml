# Queue name
qname = 'some_queue'

# Random number
random_number = 123

#logs
logs = ["trace", "debug", "warn", "info", "message"]

# Number of followers
nb_follower = 10

# Graph
graph = '9_clients_1_server.gml'

# Executables
