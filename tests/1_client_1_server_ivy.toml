# Queue name
qname = '/some_queue'

# Random number
random_number = 123

#logs
logs = ["trace", "debug", "warn", "error", "info", "message"]
log_file = "log.txt"

# Number of followers
nb_follower = 2

# Graph
graph = '1_client_1_server.gml'

# Executables
[executables]
[[executables.exe]]
name = 'client'
path = 'ping_server_test'
args = ["./ping_server_test"]
node_ids = [1]


[[executables.exe]]
name = 'server'
path = 'miniP_server'
args = ["./miniP_server", "-p", "4443", "-i", "11.0.0.2"]
node_ids = [11]

