# Queue name
qname = 'some_queue'

# Random number
random_number = 123

# Number of followers
nb_follower = 2

# Graph
graph = '9_clients_1_server_quic.gml'

# Executables
[executables]
[[executables.exe]]
name = 'client'
path = 'picoquicdemo'
args = ["./picoquicdemo",  "-q", "../logs", "-n", "servername", "-o", "../received_pages_quic/", "10.0.0.20", "4433", "index.html"]

node_ids = [1]

[[executables.exe]]
name = 'server'
path = 'picoquicdemo'
args = ["./picoquicdemo", "-p", "4433", "-w", "../web_page_quic/", "-1", "-q", "../logs"]
node_ids = [2]

